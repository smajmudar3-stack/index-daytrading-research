# Influencer registry — Engine D.
#
# SCOPE. Public strategy content and public track-record claims only: what someone teaches,
# sells, or posts about trading US index intraday or swing options. No personal information
# about anyone, on any record, ever. `teaches` describes published METHOD, not the person.
#
# extraction_status:
#   seeded     — identified and categorised; setups not yet pulled from source material
#   extracted  — every published setup pulled into influencers/strategies/*.yaml with citations
#   tested     — extracted setups have been through the gauntlet
#
# The status field exists so `engine_d_influencers.coverage()` can always state how much of
# the intended population a report actually covers. Every record below is `seeded`: this is
# the discovery pass. Extraction is transcript-by-transcript work and is queued, not done.
#
# `consensus_families` is the field that matters most. Many of these teach the same handful
# of setups in different vocabularies, and the engine deduplicates on it so a setup taught by
# thirty people is tested once rather than thirty times with the best result reported.

meta:
  created: 2026-09-02
  discovery_method: >
    Seeded from named educators whose rules are published, then expanded by category:
    intraday equity/index educators, options-premium educators, volatility and dealer-flow
    analysts, technical-pattern educators, and swing/momentum educators. Systematic
    expansion across YouTube view-ranked strategy keywords, TradingView top authors,
    Substack finance, podcast guest lists (Chat With Traders, Better System Trader, Top
    Traders Unplugged, Flirting With Models, The Derivative), and trading-book bestsellers
    is the next discovery tranche and is not yet run.
  population_target: several hundred
  honest_note: >
    This file is a discovery pass, not a survey. It records who publishes what so that
    extraction can be prioritised by consensus family rather than by follower count.

# The setup families. Deduplication happens here: this is the list of distinct hypotheses,
# and it is far shorter than the list of people teaching them.
consensus_families:
  orb:
    label: Opening-range breakout
    also_taught_as: >
      "the 9:45 break", "break of the first 15-minute candle", ICT "judas swing then
      displacement", "initial balance break", most TradingView ORB scripts
    testable: yes
    status: TESTED
  vwap_reversion:
    label: VWAP bounce / return to VWAP
    also_taught_as: >
      "anchored VWAP reversion" (Brian Shannon's AVWAP is a distinct, more specific claim),
      "mean reversion to the volume-weighted average"
    testable: yes
    status: TESTED
  gap_fill:
    label: Gap fill / gap-and-go
    also_taught_as: '"fade the gap", "gap fill by lunch", "gap and go continuation"'
    testable: yes
    status: TESTED
  premium_selling_iv_rank:
    label: Sell premium when IV rank is high, manage at 21 DTE / 50% profit
    also_taught_as: >
      tastylive's core mechanics, Option Alpha's automations, most "wheel" instruction
    testable: yes
    status: QUEUED — needs the option chain store, not minute bars
  dte45_management:
    label: Open at ~45 DTE, manage at 21 DTE or 50% max profit
    testable: yes
    status: QUEUED
  squeeze:
    label: Bollinger/Keltner squeeze fires
    also_taught_as: John Carter's "squeeze", TTM Squeeze indicator
    testable: yes
    status: QUEUED
  ict_killzone:
    label: Time-window entries (10-11am "silver bullet", London/NY kill zones)
    testable: partially
    status: QUEUED
    formalization_note: >
      The time window is concrete and testable. The entry trigger inside it ("liquidity
      sweep then market-structure shift then fair-value-gap entry") needs 2-5 separate
      formalizations and some of it may end up UNFORMALIZABLE.
  strat_combos:
    label: '"The Strat" bar-type combinations (2-1-2, 3-1-2)'
    testable: yes
    status: QUEUED
    formalization_note: Bar types are mechanically defined, so this formalizes cleanly.
  sepa_momentum:
    label: Stage-2 momentum with a volatility-contraction base
    also_taught_as: Minervini SEPA/VCP, Qullamaggie's episodic pivot, Zanger patterns
    testable: yes
    status: QUEUED
  dealer_gamma:
    label: Dealer gamma / positioning as a range or direction forecast
    testable: yes
    status: ALREADY TESTED IN THIS REPO — range yes, direction no (1,001 cells, zero survived)

