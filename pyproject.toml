[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-daytrading-research"
version = "0.1.0"
description = "SPX/NDX index options research bundle: findings, live dashboard, and backtest harnesses"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "requests",
    "yfinance",
    "anthropic",
    "jinja2",
]

[project.optional-dependencies]
# 05_studies/dl_ensemble.py only. ~1 GB; not part of a normal install.
dl = ["torch"]
dev = ["pytest", "ruff"]

[project.scripts]
idt = "idt.cli:main"

[tool.setuptools]
packages = ["idt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# The research code is intentionally dense and uses single-letter names for
# maths. Enforce the things that hide bugs, not the things that hide style.
select = ["E9", "F", "B"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
