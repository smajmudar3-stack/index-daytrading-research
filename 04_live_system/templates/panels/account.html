<section class="card is-{{ p.state }}" id="panel-{{ p.key }}">
  <h3>{{ p.title }}</h3>
  <div class=stats>
    {% for s in p.body.stats %}
    <div class="stat {{ s.severity or '' }}"><div class=n>{{ s.n }}</div><div class=l>{{ s.l }}</div></div>
    {% endfor %}
  </div>
  {% include "panels/_note.html" %}
  {% if p.source %}<div class=src>{{ p.source }}</div>{% endif %}
</section>
