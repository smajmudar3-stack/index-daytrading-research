<section class="card {{ p.severity or '' }} is-{{ p.state }}" id="panel-{{ p.key }}">
  <h3>{{ p.title }}</h3>
  {% if p.note %}<p class=note>{{ p.note }}</p>{% endif %}
  {% for m in p.body.meters %}
  <div style="margin-top:var(--s4)">
    <div class=row style="padding-left:0;padding-right:0;background:none">
      <span class=k>{{ m.label }}</span>
      <span class=v>{{ m.value }}</span>
    </div>
    <div class="meter {{ m.severity or '' }}"><span style="width:{{ m.pct }}%"></span></div>
    <p class=note style="font-size:var(--t-xs)">{{ m.why }}</p>
  </div>
  {% endfor %}
  {% if p.source %}<div class=src>Source: {{ p.source }}</div>{% endif %}
</section>
